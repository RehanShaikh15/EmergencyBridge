services:
  - type: web
    name: emergencybridge-api
    runtime: python
    plan: free
    repo: https://github.com/RehanShaikh15/EmergencyBridge
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OPENAI_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: OPENAI_VISION_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
